---

# The checks MELPA's reviewers run, on every push: melpazoid
# <https://github.com/riscy/melpazoid> byte-compiles the package as
# package-build would, runs package-lint and checkdoc over it, and looks
# for the habits MELPA asks packages to avoid.
#
# The CI job byte-compiles and runs checkdoc against the Emacs of the
# runner.  This job runs them against the recipe MELPA would build from and
# a current checkout of package-lint, which is where a symbol newer than the
# declared Emacs floor shows up.
#
# This repository ships three packages, each with its own MELPA recipe, so
# the job runs once per recipe: what is checked is one package and the
# single file that recipe ships, not the checkout as a whole.  melpazoid
# installs an adaptor's dependency `pretty-tables' from MELPA, so until
# `pretty-tables' is on MELPA the adaptors' jobs fail to byte-compile, and
# package-lint reports "Package pretty-tables is not installable".  Their
# matrix entries set `needs-melpa', which lets them fail without failing
# the workflow; remove it once `pretty-tables' is on MELPA.
#
# It fails the build only on errors.

name: melpazoid

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  melpazoid:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: pretty-tables
            recipe: '(pretty-tables :fetcher github :repo "alberti42/pretty-tables.el" :files ("pretty-tables.el"))'
          - package: pretty-tables-for-markdown
            recipe: '(pretty-tables-for-markdown :fetcher github :repo "alberti42/pretty-tables.el" :files ("pretty-tables-for-markdown.el"))'
            needs-melpa: true
          - package: pretty-tables-for-org
            recipe: '(pretty-tables-for-org :fetcher github :repo "alberti42/pretty-tables.el" :files ("pretty-tables-for-org.el"))'
            needs-melpa: true
    name: MELPA checks (${{ matrix.package }})
    continue-on-error: ${{ matrix.needs-melpa == true }}
    # A passing run takes about 3 minutes.  Without a limit, a stalled
    # apt-get keeps the job running for GitHub's default of 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # melpazoid.py runs `emacs --batch' on the runner as well as in its
      # container.  `emacs-nox' without recommends is far fewer packages
      # than `emacs', and the man-db trigger, which runs after every
      # install on the runner image, is turned off: both are where the
      # install has stalled.
      - name: Install melpazoid
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends emacs-nox
          emacs --version
          git clone https://github.com/riscy/melpazoid.git ~/melpazoid
          pip install ~/melpazoid

      - name: Run melpazoid
        env:
          LOCAL_REPO: ${{ github.workspace }}
          # The recipe MELPA would build from, so that what is checked here
          # is what MELPA would ship.
          RECIPE: ${{ matrix.recipe }}
        run: make -C ~/melpazoid
